services:
  backend:
    build: .
    image: amk-server
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
  mongodb:
      image: mongo:7

      ports:
      - "27017:27017"

      volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: